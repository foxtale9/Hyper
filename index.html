<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Írások</title>
<style>
* { box-sizing: border-box; }
body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 25% 15%, #273054 0, transparent 50%), linear-gradient(155deg, #10172e, #070b18 70%); color: #f6f5f2; font-family: 'Courier New', Courier, monospace; }
main { width: min(100% - 48px, 600px); padding: 80px 0; }
h1 { margin: 0 0 2em; font-size: 1.3rem; font-weight: normal; }
nav { display: grid; gap: 1px; }
a { display: block; padding: 1.4em 0; border-bottom: 1px solid rgba(255,255,255,.2); color: inherit; font-size: clamp(1rem, 3vw, 1.2rem); line-height: 1.5; text-decoration: none; }
a:hover, a:focus-visible { color: #c3ddff; }
a:focus-visible { outline: 1px solid currentColor; outline-offset: 5px; }
</style>
</head>
<body>
<main>
<h1>Írások</h1>
<nav aria-label="Írások">
<a href="testen-innen/">Testen innen, elmén túl</a>
<a href="csillagkep/">Csillagkép</a>
</nav>
</main>
</body>
</html>
